# bundle.conf -- kit_life default bundle definition (PRIMARY SOURCE).
#
# Read at runtime by the dogany-lifekit-setup skill (item list, kind, schedule)
# and referenced by docs. This file defines WHAT the bundle contains.
#
# KIT CATEGORY (DGN-466): this is the kit_life kit's bundle definition. The
# bundle machinery is per-kit -- a future kit (e.g. bizkit) gets its own
# service/<kit>/bundle.conf with the SAME drift contract below, dispatched by
# config/agent.conf KIT=. The kit_life files are NOT relocated under a nested
# path (the setup skill + service/kit_life/__init__.py sys.path bootstrap
# hardcode this location); "kit category" means a sibling service/<kit>/ per
# new kit, kit_life stays put. See DGN-466 for the plan.
#
# Derived surfaces that must stay in sync when THIS kit's list changes (drift
# watch; a new kit replicates the same four surfaces under its own <kit> id).
# Paths are this repo's payload/ paths; the instance path follows in brackets:
#   - payload/skills-bundle/<id>/                     (skill rows)
#       [.claude/skills-bundle/<id>/], plus pack-manifest.json skills[]
#   - payload/config/kit_life.conf                    (BUNDLE_<ID> state keys)
#       [config/kit_life.conf, copied write-if-absent]
#   - payload/config/i18n/<lang>.bundle.json          (bundle.<id> + .name)
#       [config/packs/kit_life.i18n.<lang>.json via the installer], and its
#       byte-identical copy payload/service/kit_life/i18n/<lang>.json
#   - payload/routines/bundle/<id>.sh                 (routine rows)
#       [routines/bundle/<id>.sh]
# Held by database/tests/test_kit2370_life_setup.py (row <-> key <-> i18n).
#
# Format: <id> <TAB> <kind> <TAB> <schedule> <TAB> <desc_key> <TAB> <module> <TAB> <slot>
#   id       kebab-case item id. State key = BUNDLE_<ID with - as _, uppercase>.
#   kind     skill | routine
#   schedule routines only: [dow ]HH:MM -- HH:MM = daily, '<dow> HH:MM'
#            (dow = sun|mon|..|sat) = weekly on that day (2.38.0,
#            weekly-review). '-' for skills. The kit's ONLY default-time
#            table. Briefing times (morning-brief, daily-retro,
#            weekly-review) are told and changed by the brief-setup skill
#            after activation; a domain agent gets its three times from its
#            pack at program-consult wrap (routines/bundle/brief-standard.sh
#            activate), never from this column.
#            A reader that passes the column straight to routine-ctl as
#            <HH:MM> (framework dogany-lifekit-setup before its weekday
#            passthrough) fails on the weekly row with routine-ctl's usage
#            error: closed and visible, never a silent daily schedule.
#   desc_key i18n key (kit bundle, see above) for the one-line description
#            shown during conversational activation. Descriptions never
#            restate a time: the schedule column is the ONE default source
#            (2.37.0; brief-setup quotes it from here).
#   module   (2.27.0) the module this item belongs to. The value is a token
#            from pack-manifest.json "modules" -- the roster the installer
#            already checks requires_modules against -- never a new word. A
#            module is a GROUPING for presentation: switching a module on/off
#            means switching every row of that module's BUNDLE_<ID> key
#            together. There is no BUNDLE_MODULE_* key; the per-item keys stay
#            the only stored state. A reader that only knows four columns
#            ignores this one.
#   slot     (framework DGN-1826, requires_framework >=2.6.0) the generic-brief
#            slot this routine owns: morning | retro | weekly | '-' (none).
#            Lowercase, never empty. All-or-nothing: every data row carries
#            it or none does. A value other than '-' only on a kind=routine
#            row; each slot has at most one owner row. bundle-routine-ctl.sh
#            (on/off/slot-sync/slot <id>) swaps the generic brief from this
#            column; no kit script restates the routine->slot map. Any
#            violation makes every helper call exit 1, nothing changed.
#
# DIRECTIVE ROWS (framework DGN-1840). A line starting with '@' is a
# directive, NOT a data row: every reader that parses the six-column rows
# above MUST skip lines starting with '@' (as it skips '#'). Two directives,
# names agreed with the framework (do not rename):
#   @always-on <TAB> <skill-id>
#       a kit skill that is on for every LIFEKIT=on instance and has no menu
#       row (no BUNDLE_<ID> key, never offered, never switched off).
#       pack-manifest.json skills[] == the kind=skill data rows + the
#       @always-on ids, exactly.
#   @domain-subset <TAB> <domain> <TAB> <skill-id>
#       a LIFEKIT=off domain agent of <domain> gets ONLY the listed kit
#       skills -- the @always-on set does NOT reach it; list an always-on
#       skill here too if that domain needs it. Every id is a
#       pack-manifest.json skills[] name. Ids are live ids, never a retired
#       one (skill-aliases.tsv).
# Installer activation (framework DGN-1840): LIFEKIT=on -> @always-on +
# BUNDLE_<ID>=on; LIFEKIT=pending/offered/absent, or off on a main ->
# bodies delivered, nothing activated (the setup skill links later);
# LIFEKIT=off on a domain instance -> its @domain-subset only.
# Cut gate: requires_framework floor = the framework release that carries
# the @-row readers (the release steward names the exact version), not ">=2.6.1".
# Held by database/tests/test_bundle_directives.py.
#
# EVERY ROW SHIPS WITH THIS KIT (2.27.0). The pack-shipped rows are gone:
# workout-log returned to the kit as the session-level record, and
# diet-status (the health pack's coaching card) left the menu -- a pack's
# skills are activated by that pack, not listed in the kit's menu.
#
# weekly-review (2.38.0): the weekly retro, promoted from the life agent's
# instance-owned weekly once the task verbs (task-done-between, event-window,
# goal-list --owning-agent, spend-week) existed. Main agent: the life areas;
# domain agent: its providers' areas (routines/bundle/weekly-review.sh).
#
# day-card CADENCE NOTE (2.25.0). The schedule column is one HH:MM because
# that is all routine-ctl.sh can schedule, and 07:00 is the first waking-hour
# run. This routine's full cadence is THREE legs and only one of them is that
# timer: morning-brief.sh builds the card at brief time, kit_life.py refreshes
# it after a schedule write, and routines/bundle/day-card-ctl.sh raises the
# timer leg to hourly through waking hours (a card whose past/now/ahead split
# only moves once a day is a pin that looks live and is not).
schedule-log	skill	-	bundle.schedule_log	module_schedule	-
meal-log	skill	-	bundle.meal_log	module_meal	-
workout-log	skill	-	bundle.workout_log	module_workout	-
place-manage	skill	-	bundle.place_manage	module_place	-
person-manage	skill	-	bundle.person_manage	module_person	-
person-session	skill	-	bundle.person_session	module_person	-
routine-manage	skill	-	bundle.routine_manage	module_routine	-
goal-session	skill	-	bundle.goal_session	module_goal	-
core-setup	skill	-	bundle.core_setup	module_core	-
brief-setup	skill	-	bundle.brief_setup	module_brief	-
health-log	skill	-	bundle.health_log	module_health	-
morning-brief	routine	06:00	bundle.morning_brief	module_brief	morning
daily-retro	routine	22:00	bundle.daily_retro	module_brief	retro
weekly-review	routine	sun 22:00	bundle.weekly_review	module_brief	weekly
day-card	routine	07:00	bundle.day_card	module_schedule	-
@always-on	ledger-view
@always-on	place-view
@always-on	brief-session
@always-on	episode-log
@always-on	episode-session
@always-on	episode-setup
@domain-subset	health	meal-log
@domain-subset	health	workout-log
@domain-subset	health	goal-session
@domain-subset	health	health-log
@domain-subset	health	routine-manage
@domain-subset	health	schedule-log
@domain-subset	health	brief-session
