# axis.conf -- kit_life axis state (축 상태) row declaration (PRIMARY SOURCE).
#
# Read by database/axis_state.py for the weekly retro's lapsed-axis section
# (service/kit_life/axis-lapsed, registered in retro-sections.tsv). There is
# no pinned board (spec section 9, owner 2026-09-26). This file defines WHICH
# axes are watched and WHICH resolver answers "is this axis alive" for each
# -- it does NOT define the query itself. See the
# 2026-09-17 axis-board pin spec, section 3-1 for the design that forced
# this split (SQL in conf cannot be tested and cannot dodge the per-module
# traps in section 3; only code can).
#
# The row list is BUILT-IN, not pack-extensible (PURPOSE.md P5 boundary):
# a market pack may change HOW an axis is judged (a resolver it ships), but
# never WHETHER the row appears. Packs do not get their own axis.conf scan.
#
# Derived surfaces that must stay in sync when this file's row list changes
# (drift watch):
#   - database/axis_state.py                  RESOLVERS registry needs a
#                                              matching function per new
#                                              resolver name
#   - config/i18n/{en,ko}.bundle.json          axis.<id> label strings (kit bundle)
#
# Format: <axis_id> <TAB> <label_key> <TAB> <resolver> <TAB> <stale_after_days>
#   axis_id           module id (pack-manifest modules, 1:1)
#   label_key         kit i18n key (config/i18n/<lang>.bundle.json).
#                      label text in the retro line -- never hardcoded here.
#   resolver          name of a function in database/axis_state.py's
#                      RESOLVERS registry. The query lives in code, not here
#                      (spec 3-1: SQL in conf cannot be unit-tested and each
#                      axis reads its own source table, not a shared column).
#   stale_after_days  days with no fresh record before the axis reads
#                      "lapsed" and gets a line in the weekly retro.
#
# DRAFT (spec 3-1): stale_after_days values below have NO evidence yet. They
# are a starting point for owner dogfooding, not a measured product decision
# -- do not treat them as settled, and do not invent a justification for one
# that was not actually measured.
execution	axis.execution	last_block_past	3
person	axis.person	last_person_contact	21
meal	axis.meal	last_meal_record	2
spend	axis.spend	last_spend_record	14
goal	axis.goal	last_goal_touch	14
routine	axis.routine	last_routine_run	7
episode	axis.episode	last_episode	14
