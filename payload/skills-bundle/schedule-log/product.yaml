# 2.19.0 merge of appointment-log + task-update. The execution axis is an AXIS,
# not a module -- storage was already one `block` table with a `kind` column and
# the mirror routes on time-ness, not kind, so the two-skill split matched
# neither line. `type: module` above is the product-registry vocabulary for a
# shippable unit; it does NOT declare a module_* entity in pack-manifest.json
# (module_appointment / module_task were dismantled in the same cut).
