# kit_life.conf -- per-instance kit_life activation state (non-secret).
#
# Written by the dogany-lifekit-setup skill; users may also edit by hand and
# then ask the agent to "apply kit_life settings" (the skill reconciles state
# -> actual symlinks/schedules idempotently).
#
# LIFEKIT lifecycle:
#   pending  fresh mint; the agent offers the kit_life walkthrough once after
#            user onboarding completes.
#   offered  the offer was made (or declined for now); no more auto-prompts.
#            The user can start anytime ("set up life management").
#   on       bundle active (per-item BUNDLE_* flags say which items).
#   off      kit_life declined; agent does not bring it up.
#
# BUNDLE_<ID>: on | off | (empty = undecided). Item ids and descriptions come
# from service/kit_life/bundle.conf (primary source).
#
# NOTE (mint contract): mint.sh copies this scaffold ONLY if the instance has
# no kit_life.conf yet (write-if-absent, same contract as .env / kit_life.db),
# so a re-mint / reconfigure never resets user choices.
LIFEKIT=pending
BUNDLE_SCHEDULE_LOG=
BUNDLE_MEAL_LOG=
BUNDLE_WORKOUT_LOG=
BUNDLE_PLACE_MANAGE=
BUNDLE_PERSON_MANAGE=
BUNDLE_PERSON_SESSION=
BUNDLE_ROUTINE_MANAGE=
BUNDLE_GOAL_SESSION=
BUNDLE_CORE_SETUP=
BUNDLE_BRIEF_SETUP=
BUNDLE_HEALTH_LOG=
BUNDLE_MORNING_BRIEF=
BUNDLE_DAILY_RETRO=
BUNDLE_WEEKLY_REVIEW=
BUNDLE_DAY_CARD=
# LIFEKIT_DAY_CARD_PIN: on | off. When on (default), a schedule WRITE verb
# fires a detached refresh of the pinned day card. off leaves the pin to the
# morning brief and the waking-hours timer only. Every failure mode of this
# leg is already a silent no-op -- the knob is for an instance that wants the
# write path to touch nothing at all.
#LIFEKIT_DAY_CARD_PIN=on
# LIFEKIT_DAY_CARD_TTL: seconds the pinned day-card section survives without
# a refresh (default 7200). A producer that stops -- laptop asleep, routine
# unloaded -- then takes its own card down instead of pinning a stale day.
#LIFEKIT_DAY_CARD_TTL=7200
# LIFEKIT_DAY_CARD_FRESH_WAIT: seconds the morning brief waits for the bridge
# to confirm its fresh pinned day card (day-card.sh --fresh; framework
# DGN-1768 r2, status-footer.py --pin-set --fresh --wait). Default 90. On a
# timeout the schedule goes into the text brief instead. Pair with the
# framework knob DASHBOARD_ROTATE=explicit on an instance whose day starts
# with the brief, so only the brief rotates the pinned board.
#LIFEKIT_DAY_CARD_FRESH_WAIT=90
# MIRROR_MODULE: on | off. Enables GCal/GTasks mirror (DGN-180/DGN-259).
# Requires mirror/ dir present and gws CLI configured. Default off.
MIRROR_MODULE=off
# MIRROR_NOTION_IMPORT_CUTOFF / MIRROR_NOTION_IMPORT_MIN_START: the instance's
# notion-import epoch (DGN-265/DGN-870). Recurrence rows with
# created_by=notion-import are mirror scope only when rec_date >= CUTOFF
# (YYYY-MM-DD) AND start_at >= MIN_START (canonical UTC YYYY-MM-DDTHH:MM:SSZ).
# FROZEN values -- never move them to "today". Required ONLY on an instance
# that holds notion-import rows: with either key unset or malformed, push and
# reconcile refuse such a row with NotionImportBoundError (no literal fallback).
# The first instance's epoch was CUTOFF=2026-07-12, MIN_START=2026-07-12T02:00:00Z.
#MIRROR_NOTION_IMPORT_CUTOFF=
#MIRROR_NOTION_IMPORT_MIN_START=
# MIRROR_OPS_ENV_FILE: absolute path to the kit operator's push .env
# (DGN-306/DGN-364; ticket 2026-09-26 calendar-sync-report-routing). Every
# mirror machine report (weekly reconcile_report, mirror_persistent_failure/
# recovered) goes, with an agent-labeled prefix (i18n mirror.ops.prefix,
# label from DOGANY_AGENT_LABEL), to: (1) this file via push.sh --env when
# set and present; else (2) the framework operator (push.sh --audience
# operator --no-owner-fallback, agent.conf STEWARD_ENV_FILE); else (3)
# nowhere -- logged as notify_unrouted. Machine reports NEVER reach the
# owner chat. Set this to the kit steward's bot .env at install time.
#MIRROR_OPS_ENV_FILE=
# MIRROR_TASKLIST_NAME: DEPRECATED (DGN-364 m5). In the multi-calendar
# path the checklist display name comes from MIRROR_CAL_NAME prefix +
# i18n (mirror.gtasks.checklist). Still honored by legacy single-calendar
# bootstrap(); silently unused in multi mode.
#MIRROR_TASKLIST_NAME=
